<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>Antipodal pairs in the two-ball picture: an interior point of ball 2 pairs with the reflected point of ball 1; a boundary point pairs with the opposite boundary point</title>
  <!-- balls, drawn as stacked disks -->
  <ellipse cx="320" cy="110" rx="200" ry="55" fill="#2f7fd0" fill-opacity="0.12" stroke="#7f7f7f" stroke-width="2"/>
  <ellipse cx="320" cy="290" rx="200" ry="55" fill="#2f7fd0" fill-opacity="0.12" stroke="#7f7f7f" stroke-width="2"/>
  <text x="20" y="115" fill="#7f7f7f">ball 1</text>
  <text x="20" y="295" fill="#7f7f7f">ball 2</text>
  <!-- gluing: same boundary point -->
  <line x1="520" y1="110" x2="520" y2="290" stroke="#7f7f7f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="120" y1="110" x2="120" y2="290" stroke="#7f7f7f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="528" y="195" fill="#7f7f7f">gluing:</text>
  <text x="528" y="215" fill="#7f7f7f">same point</text>
  <!-- antipodal pair on the boundary: p and -p -->
  <line x1="520" y1="110" x2="120" y2="110" stroke="#e07b00" stroke-width="2" stroke-dasharray="2 4"/>
  <g fill="#e07b00" font-weight="bold">
    <circle cx="520" cy="110" r="5"/><circle cx="120" cy="110" r="5"/>
    <circle cx="520" cy="290" r="5"/><circle cx="120" cy="290" r="5"/>
    <text x="530" y="104">p</text><text x="530" y="284">p</text>
    <text x="88" y="104">−p</text><text x="88" y="284">−p</text>
  </g>
  <!-- interior point x in ball 2 at drawn position v, partner -x in ball 1 at -v -->
  <line x1="410" y1="305" x2="230" y2="95" stroke="#2f7fd0" stroke-width="2" stroke-dasharray="2 4"/>
  <g fill="#2f7fd0" font-weight="bold">
    <circle cx="410" cy="305" r="5"/><circle cx="230" cy="95" r="5"/>
    <text x="420" y="320">x, drawn at v</text>
    <text x="180" y="85">−x, drawn at −v</text>
  </g>
  <g fill="#7f7f7f"><circle cx="320" cy="110" r="3"/><circle cx="320" cy="290" r="3"/></g>
  <text x="320" y="375" fill="#7f7f7f" text-anchor="middle">Antipodal pairing x ∼ −x: an interior point of one ball pairs with the</text>
  <text x="320" y="395" fill="#7f7f7f" text-anchor="middle">point-reflected position in the other ball; a boundary point p pairs with −p.</text>
</svg>
