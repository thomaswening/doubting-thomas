# Copied from claude-config, skills/project-docs/assets/docs-check.yml (checker 1.3).
# Checks every pull request's Markdown with tools/check_docs.py: relative links and their
# anchors (claim anchors included), and that every Mermaid diagram renders.
# What it checks and how to fix a failure: AGENTS.md, section 9, and
# https://github.com/thomaswening/claude-config/blob/main/skills/project-docs/references/docs-check.md
name: docs-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the checker diffs against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4 # npx runs mermaid-cli for the Mermaid check
        with:
          node-version: "22"
      - name: Check documents
        run: >-
          python tools/check_docs.py . --base "origin/${{ github.base_ref }}"
          --markdown "topics/**/*.md" "templates/*.md" "*.md"
